# Render Blueprint: https://render.com/docs/blueprint-spec
# Dashboard → New → Blueprint → connect this repo (uses render.yaml)

services:
  - type: web
    name: job-tracker
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_NAME
        value: Job Tracker
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_SSLMODE
        value: require
      - key: RENDER_POSTGRES_HOST_SUFFIX
        value: singapore-postgres.render.com
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: SESSION_SAME_SITE
        value: lax
      # Generate locally: php artisan key:generate --show
      - key: APP_KEY
        sync: false
      # Optional override; if unset, config/app.php uses Render's RENDER_EXTERNAL_URL
      - key: DATABASE_URL
        fromDatabase:
          name: job-tracker-db
          property: connectionString

databases:
  - name: job-tracker-db
    plan: free
    databaseName: job_tracker
    user: job_tracker
