# Render Blueprint: https://render.com/docs/blueprint-spec
# Dashboard → New → Blueprint → connect this repo (uses render.yaml)

services:
  - type: web
    name: job-tracker
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_NAME
        value: Job Tracker
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: SESSION_SAME_SITE
        value: lax
      # Generate locally: php artisan key:generate --show
      - key: APP_KEY
        sync: false
      # After first deploy, set to your Render URL (e.g. https://job-tracker.onrender.com)
      - key: APP_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: job-tracker-db
          property: connectionString

databases:
  - name: job-tracker-db
    plan: free
    databaseName: job_tracker
    user: job_tracker
