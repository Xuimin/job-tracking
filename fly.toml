# Rename `app` after: fly apps create YOUR-NAME
app = 'job-tracker'
primary_region = 'sin'

[build]
  dockerfile = "Dockerfile"

[env]
  APP_ENV = 'production'
  APP_DEBUG = 'false'
  LOG_CHANNEL = 'stderr'
  DB_CONNECTION = 'pgsql'
  SESSION_DRIVER = 'database'
  CACHE_STORE = 'database'
  QUEUE_CONNECTION = 'sync'
  SESSION_SECURE_COOKIE = 'true'
  SESSION_SAME_SITE = 'lax'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/up'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1

[deploy]
  release_command = 'php artisan migrate --force'
