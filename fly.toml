# fly.toml app configuration file generated for xm-job-tracking on 2026-10-26T11:32:10Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'xm-job-tracking'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[env]
  APP_DEBUG = 'false'
  APP_ENV = 'production'
  CACHE_STORE = 'database'
  DB_CONNECTION = 'pgsql'
  DB_SSLMODE = 'require'
  LOG_CHANNEL = 'stderr'
  QUEUE_CONNECTION = 'sync'
  SESSION_DRIVER = 'database'
  SESSION_SAME_SITE = 'lax'
  SESSION_SECURE_COOKIE = 'true'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/up'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
